<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Animado Neon</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="background">
    <div class="neon-ring"></div>
    <div class="login-container">
        <form class="face front">  
        <h1>BEM VINDO</h1>
        <p>Entre com sua conta</p>
        <input type="email" placeholder="Endereço de e-mail">
        <input type="password" placeholder="Senha">
        <div class="options">
        <label><input type="checkbox"> Esqueceu a senha?</label>
        <a href="#">Lembrar-me.</a>
    </div>
    <button type="button">Entrar</button>
    <p>Cadastre-se <a class="show-signup"  href="#" >aqui</a>.</p>
        </form>

        <form class="face back">
        <h1>CADASTRO</h1>
        <p>Crie sua conta</p>
        <input type="text" placeholder="Nome completo">
        <input type="email" placeholder="Endereço de e-mail">
        <input type="password" placeholder="Senha">
        <input type="password" placeholder="Confirmar senha">
        <button type="button">Cadastrar</button>
        <p>Já tem uma conta? <a href="#" class="show-login">Entre aqui</a>.</p>
        </form>
    </div>
    </div>
</body>
</html>
